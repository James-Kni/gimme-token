[package]
name = "gimme-token"
version = "2.0.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
aws-cognito-srp = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
dirs = "6"

[profile.release]
strip = true
lto = true
